<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onde Estou</title>
<meta name="theme-color" content="#14312e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#eef2ef;--ink:#14312e;--accent:#e4572e;--muted:#5b716c}
@media (prefers-color-scheme:dark){:root{--bg:#0e1f1d;--ink:#e6efec;--muted:#93aaa5}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font:700 1.5rem Georgia,serif;margin:0}
#instalar{display:none;border:2px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:600}
#mapa{flex:1;min-height:240px;margin:0 16px;border-radius:14px;overflow:hidden;background:#cfdcd7;display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px}
#mapa iframe{width:100%;height:100%;border:0;display:block;margin:-16px}
.info{padding:12px 16px 16px}
#status{margin:0 0 10px;color:var(--muted);min-height:1.5em}
button#loc{width:100%;min-height:52px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem}
button:disabled{opacity:.5}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Onde Estou</h1><button id="instalar">Instalar app</button></header>
<div id="mapa">Toque no botão abaixo para ver sua localização no mapa.</div>
<div class="info">
  <p id="status" role="status" aria-live="polite"></p>
  <button id="loc">Mostrar minha localização</button>
</div>
<script>
const $ = id => document.getElementById(id);

$('loc').onclick = () => {
  if (!('geolocation' in navigator)) { $('status').textContent = 'Este aparelho não oferece geolocalização.'; return; }
  $('status').textContent = 'Obtendo localização…'; $('loc').disabled = true;
  navigator.geolocation.getCurrentPosition(p => {
    const { latitude: la, longitude: lo, accuracy } = p.coords, d = 0.005;
    const bbox = [lo - d, la - d, lo + d, la + d].join('%2C');
    $('mapa').innerHTML = '<iframe title="Mapa com sua localização" src="https://www.openstreetmap.org/export/embed.html?bbox=' + bbox + '&layer=mapnik&marker=' + la + '%2C' + lo + '"></iframe>';
    $('status').textContent = 'Lat ' + la.toFixed(5) + ', Lon ' + lo.toFixed(5) + ' (precisão ±' + Math.round(accuracy) + ' m)';
    $('loc').disabled = false; $('loc').textContent = 'Atualizar localização';
  }, err => {
    $('status').textContent = err.code === 1 ? 'Permissão negada. Libere a localização nas configurações do navegador.' : 'Não foi possível obter a localização. Verifique o GPS e a internet.';
    $('loc').disabled = false;
  }, { enableHighAccuracy: true, timeout: 15000 });
};

// PWA
let prompt;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; $('instalar').style.display = 'block'; });
$('instalar').onclick = async () => { prompt.prompt(); await prompt.userChoice; $('instalar').style.display = 'none'; };
addEventListener('appinstalled', () => $('instalar').style.display = 'none');
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
